<div class="post-container">
    <div class="post-avatar">
        <a href="{{ url_for('main.user', username=post.author.username) }}">
            <img src="{{ post.author.avatar(30) }}" class="rounded-full">
        </a>
    </div>
    <div class="post-content">
        {% set user_link %}
            <a href="{{ url_for('main.user', username=post.author.username) }}">
                {{ post.author.username }}
            </a>
        {% endset %}
        <p class="post-info">{{ _('%(username)s said %(when)s',
            username=user_link, when=moment(post.timestamp).fromNow()) }}</p>
        <br>
        <span id="post{{ post.id }}">{{ post.body }}</span>
    </div>
</div>
