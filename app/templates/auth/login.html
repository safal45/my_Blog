{% extends 'base.html' %}
{% import 'bootstrap/wtf.html' as wtf %}

{% block app_content %}

<div class=" colorman w-full " style="display: flex;justify-content: center;">
        <div class="mylogin w-full md:w-1/2 lg:w-1/3 border-2 border-black p-8 bg-white rounded-lg shadow-lg transform transition-transform hover:scale-105 flex items-center justify-center"  >
            <h1 class="text-3xl font-bold text-center mb-6">{{ _('Sign In') }}</h1>
            {{ wtf.quick_form(form) }}
            <br>
            <p class="text-center text-gray-600">{{ _('New User?') }} <a href="{{ url_for('auth.register') }}" class="text-purple-500 hover:underline">{{ _('Click to Register!') }}</a></p>
            <p class="text-center mt-2 text-gray-600">
                {{ _('Forgot Your Password?') }}
                <a href="{{ url_for('auth.reset_password_request') }}" class="text-purple-500 hover:underline">{{ _('Click to Reset It') }}</a>
            </p>
        </div>
    </div>
{% endblock %}
